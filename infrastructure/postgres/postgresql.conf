# No TCP listener. Initial administrator access is local OS peer only.
listen_addresses = ''
unix_socket_directories = '/var/run/postgresql'
unix_socket_permissions = 0770
hba_file = '/etc/ai-invest/pg_hba.conf'
shared_preload_libraries = 'pg_tde'
# Fail startup without the required configured WAL principal key; no silent off.
pg_tde.wal_encrypt = on
max_connections = 12
shared_buffers = '256MB'
work_mem = '4MB'
maintenance_work_mem = '64MB'
max_worker_processes = 4
max_parallel_workers = 2
temp_file_limit = '256MB'
max_wal_size = '1GB'
min_wal_size = '80MB'
fsync = on
synchronous_commit = on
full_page_writes = on
logging_collector = on
log_directory = '/var/log/ai-invest-postgres'
log_filename = 'postgresql-%a.log'
log_rotation_age = '1d'
log_rotation_size = '16MB'
log_truncate_on_rotation = on
log_file_mode = 0600
log_statement = 'none'
log_min_error_statement = 'panic'
log_error_verbosity = 'terse'
log_connections = off
log_disconnections = off
